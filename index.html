<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
  window.TrackJS && TrackJS.install({
    token: "1325a8fbbb764b62ae52c0699d3fc6a7"
  });
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

    <script>
    // ─── Step 5: Global Error Handler ───────────────────────────────────────
    window.addEventListener('error', (event) => {
      console.log(
        `[Global Error Caught]\nMessage: ${event.message}\nFile: ${event.filename}\nLine: ${event.lineno}`
      );
      console.log('[Remote Log] Sending error report...', {
        message: event.message,
        source: event.filename,
        line: event.lineno,
        timestamp: new Date().toISOString()
      });
    });
  
    window.onerror = function (message, source, lineno) {
      console.log(`[window.onerror] message="${message}" source="${source}" line=${lineno}`);
      return true;
    };
  
    // ─── Step 4: Custom Error class ─────────────────────────────────────────
    class DivisionByZeroError extends Error {
      constructor(message) {
        super(message);
        this.name = 'DivisionByZeroError';
      }
    }
  
    // ─── Step 3: Try/Catch/Finally in the calculator ────────────────────────
    const form = document.querySelector('form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const output = document.querySelector('output');
      const firstNum  = document.querySelector('#first-num').value.trim();
      const secondNum = document.querySelector('#second-num').value.trim();
      const operator  = document.querySelector('#operator').value;
  
      try {
        if (firstNum === '' || secondNum === '') throw new Error('Both fields must be filled in.');
        if (isNaN(firstNum) || isNaN(secondNum)) throw new TypeError('Inputs must be valid numbers.');
        if (operator === '/' && Number(secondNum) === 0) throw new DivisionByZeroError('Cannot divide by zero.');
  
        output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
  
      } catch (err) {
        output.innerHTML = `[${err.name}] ${err.message}`;
        console.error('Caught:', err);
      } finally {
        console.log('Calculator attempt complete (finally block).');
      }
    });
  
    // ─── Step 2: Console buttons ─────────────────────────────────────────────
    const sampleUsers = [
      { id: 1, name: 'Alice', role: 'admin' },
      { id: 2, name: 'Bob',   role: 'user'  },
      { id: 3, name: 'Carol', role: 'mod'   }
    ];
  
    const errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));
  
    errorBtns[0].addEventListener('click', () => console.log('console.log demo:', sampleUsers));
    errorBtns[1].addEventListener('click', () => console.error('console.error: something went wrong!'));
    errorBtns[2].addEventListener('click', () => console.count('button-clicks'));
    errorBtns[3].addEventListener('click', () => console.warn('console.warn: potentially dangerous action'));
    errorBtns[4].addEventListener('click', () => {
      console.assert(1 + 1 === 2, 'This passes silently');
      console.assert(1 + 1 === 3, 'Assertion failed: 1+1 is not 3');
    });
    errorBtns[5].addEventListener('click', () => console.clear());
    errorBtns[6].addEventListener('click', () => console.dir(document.querySelector('form')));
    errorBtns[7].addEventListener('click', () => console.dirxml(document.querySelector('fieldset')));
    errorBtns[8].addEventListener('click', () => {
      console.group('User Report');
      sampleUsers.forEach(u => console.log(`[${u.role}] ${u.name}`));
    });
    errorBtns[9].addEventListener('click', () => { console.groupEnd(); console.log('Group closed.'); });
    errorBtns[10].addEventListener('click', () => console.table(sampleUsers));
    errorBtns[11].addEventListener('click', () => { console.time('demo-timer'); console.log('Timer started.'); });
    errorBtns[12].addEventListener('click', () => console.timeEnd('demo-timer'));
    errorBtns[13].addEventListener('click', () => {
      function inner() { console.trace('Trace from inner()'); }
      function outer() { inner(); }
      outer();
    });
    // Trigger a Global Error — fires outside try/catch via setTimeout
    errorBtns[14].addEventListener('click', () => {
      setTimeout(() => { thisVariableDoesNotExist.causeAnError(); }, 0);
    });
  </script>
</body>

</html>
